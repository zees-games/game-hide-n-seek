# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the client bench has no map switch, so "manor" is the real client against the real server scene and module on its default map.
PERF_CASES=manor
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is a map id; the shots are tools/shot.sh views.
VISUAL_CASES="hs_manor"
VISUAL_SHOTS="overview seeker"

visual_render() {
    for shot in $VISUAL_SHOTS; do
        heavy -- timeout 300 tools/shot.sh --view="$shot" --hs-map-ids="$1" --name="${1}_${shot}" \
            --out="res://screenshots/${1}_${shot}.png" || return 1
    done
}
