# game-hide-n-seek: every key of this file at its code default, commented out. Uncomment a line to change it;
# an operator overrides in cfg/server/game/game-hide-n-seek/config_maps/game.yml. Layers: defaults < this < env < argv.

# --- The maps
# Which maps this server may play, by id. Empty means every one it has.
# map_ids: []
# Whether the next map is drawn at random (seeded) rather than taken in order.
# shuffle_maps: true
# Rounds played on a map before the next one, unless the players vote first. [1..]
# rounds_per_map: 4
# Where map documents are read from, relative to this game's root.
# map_directory: "maps"
# The file that says which maps a server ROTATES: `cfg/maps.yml` over the shipped `res://maps.yml` (gs-map's...
# map_rotation_file: "cfg/maps.yml"
# Seed every random choice is drawn from: the map, the seekers, the bots.
# seed_value: 20261010
# The most boxes a map document may hold; a map past it is refused with the count. 0 = no limit. [0..]
# max_map_boxes: 0
# The most props a map document may hold. 0 = no limit. [0..]
# max_map_props: 0
# The most lights a map document may hold. 0 = no limit; what they cost to draw is the map's choice. [0..]
# max_map_lights: 0
# Past this many lights a map is still played, with a warning in the log. 0 = no warning. [0..]
# map_lights_warn: 128
# The most spawns a map document may give each side. 0 = no limit. [0..]
# max_map_spawns: 0
# The most doors a map document may hold. 0 = no limit. [0..]
# max_map_doors: 0
# The most toys (balls, trampolines, switches) a map document may hold. 0 = no limit. [0..]
# max_map_toys: 0

# --- Bots
# How many players the server keeps in the round by adding stand-ins. [0..]
# minimum_players: 5
